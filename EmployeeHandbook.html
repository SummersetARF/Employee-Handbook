on or harassment or assists in investigating such charges. Any form of retaliation is considered a direct violation of this policy and, like discrimination or harassment itself, will be subject to disciplinary action, up to\n\nand including termination of employment.\n\n <!-- Source PDF page 60 -->"], ["6.16 Visitors in the Workplace", "To ensure the safety and security ofp SUMMERSET ARF. and its employees, only\n\nauthorized visitors are permitted on Company premises and in Company facilities.\n\nAll visitors must enter through the main reception area and sign in and out at the front desk. All visitors are also required to wear a \"visitor \" badge while on SUMMERSET ARF. premises. Authorized visitors will be escorted to their destination and must be accompanied by a representative of the Company at all\n\ntimes."]]}, {"title": "Timekeeping & Payroll", "policies": [["7.1 Attendance & Punctuality", "Absenteeism and tardiness place an undue burden on other employees and on the Company. SUMMERSET ARF. expects regular attendance and punctuality from all employees. This means being in the workplace, ready to work, at your scheduled start time each day and completing your entire shift. Employees are also expected\n\nto return from scheduled meal and break periods on time.\n\nAll time off must be requested through our electronic shift planning system. If an employee is unexpectedly unable to report for work for any reason, he or she must directly notify the Administrator as early as possible, and preferably prior to their scheduled starting time. It is not acceptable to leave a voicemail message with a supervisor, except in extreme emergencies. In cases that warrant leaving a voicemail message or when the Administrator is unavailable, a follow-up call must\n\nbe made later that day.\n\n <!-- Source PDF page 61 -->\n\nIf an illness or emergency occurs during work hours, employees should notify their\n\nsupervisor as soon as possible.\n\nIf staff need to call out, staff must contact management 2 hours prior to the start of their shift. If the staff call out within the 2-hour window of their shift, it will be\n\nconsidered a no call no show.\n\nEmployees, who are going to be absent for more than one day, should contact their supervisor on each day of their absence. SUMMERSET ARF. reserves the right to ask for a physician's statement and/or a new health screening in the event of a long- term\n\nillness (three consecutive days), contagious disease, multiple illnesses or injuries.\n\nIf an employee fails to notify their supervisor after three consecutive days of absence, SUMMERSET ARF. will presume that the employee has voluntarily resigned. SUMMERSET ARF. will review any extenuating circumstances that may have prevented him or her from calling in before the employee is removed from\n\npayroll.\n\nAttendance is included in the probationary and annual performance reviews. It is the\n\npolicy of this Company that six annual absences are considered to be excessive.\n\nShould undue or recurrent absence and tardiness become apparent, the employee will be subject to disciplinary action, up to and including termination of\n\nemployment."], ["7.2 Timekeeping", "It is the Company's policy to comply with applicable laws that require records to be maintained of the hours worked by our employees. Every employee is responsible for accurately recording time worked. Employees should not clock in more than five\n\nminutes before the start of their shift unless asked by a supervisor to do so. My\n\n <!-- Source PDF page 62 -->\n\nerrors in time records, must be immediately reported to your supervisor and\n\nproperly documented on the appropriate form.\n\n <!-- Source PDF page 63 -->\n\nAbsent prior authorization, employees are not permitted to start work until\n\ntheir scheduled starting time or work past their scheduled ending time.\n\nAltering, falsifying, tampering with time records, or recording time on another employee's time record may result in disciplinary action up to and including\n\ntermination of employment. ###"], ["7.3 Paydays", "SUMMERSET ARF. employees are paid on a Semi-monthly basis. Pay is\n\ndistributed as follows:\n\n1st through the 15th of the month: paid the 25th of the month.\n\n16th through the end of the month: paid the 10th of the following month.\n\nIn the event that a regularly scheduled payday falls on a holiday or weekend, employees will be paid by the first business day following the holiday or weekend,\n\nunless otherwise required by state law.\n\nPaychecks will not, under any circumstances, be given to any person other than the employee without written authorization. Paychecks may also be mailed to the employee's listed address or, upon advance written authorization, deposited directly into an employee's bank account. Employees who elect payment through direct deposit will receive an itemized statement of wages when the Company makes\n\ndirect deposits.\n\nIn the event of employee termination, the employee will receive their accrued pay in\n\n <!-- Source PDF page 64 -->\n\naccordance with applicable federal, state and local laws."], ["7.4 Payroll Deductions", "SUMMERSET ARF. makes deductions from employee pay only in circumstances permitted by applicable law. This includes, but is not limited to, mandatory deductions for income tax withholding and Social Security, Medicare contributions,\n\nand other related contributions.\n\nIf you believe that an improper deduction has been made from your pay, raise the issue with the Administrator immediately. SUMMERSET ARF. will promptly investigate. If the investigation reveals that you were subjected to an improper\n\ndeduction from pay, you will be reimbursed promptly."], ["7.5 Overtime (California Employees)", "The nature of our business sometimes requires employees to work overtime. Supervisors will notify employees when overtime is required. Employees are not\n\npermitted to work overtime without prior authorization from their supervisor.\n\nNon-exempt employees will be paid overtime in accordance with state and federal\n\novertime requirements as follows:\n\n* One and one-half times (1.5) the regular rate of pay for all hours worked in\n\nexcess of eight (12) hours in any workday;\n\n* One and one-half times (1.5) the regular rate of pay for all hours worked in\n\n <!-- Source PDF page 65 -->\n\nexcess of 40 hours in the same workweek; *\n\n* Two times the regular rate of pay (or double time) for all hours worked\n\nin excess of twelve (12) in any workday;\n\n* One and one-half times (1.5) the regular rate of pay for the first eight\n\n(8) hours on the seventh consecutive day in the same workweek; *\n\n* Two times the regular rate of pay (or double time) for all hours worked in\n\nexcess of eight (8) on the seventh consecutive day in the same workweek.\n\nThere may be exceptions to these standards where allowed by law. Employees are encouraged to speak with their supervisor or the Administrator for more information.\n\nPlease be reminded employees are not permitted to work overtime unless it has\n\nbeen authorized in advance by their supervisor.\n\nEmployees are generally entitled to a day of rest after working six consecutive days in the same workweek, unless their work hours never exceed 30 in any workweek\n\nor six on any day of the workweek. Employees aren't encouraged to forgo their day\n\nof rest, but they may voluntarily choose to do so. Before foregoing a day of rest, notify the Administrator in writing. If the nature of the job requires an employee to work seven or more consecutive days, the employee will receive, in each calendar month, the\n\nequivalent of one day's rest in seven.\n\n* The workweek is defined as any seven consecutive days, starting with the same\ncalendar day each week, as determined by SUMMERSET ARF. For more\ninformation, employees are encouraged to speak with their supervisor or the\n\nAdministrator."], ["7.6 Requesting Time Off", "Employees must request time off 30 days in advance prior to date needed. Request will go by first come first serve basis unless there are multiple employees requesting the same\n\n <!-- Source PDF page 66 -->\n\ndays. It will go by seniority or will be given to the employee with the least amount of days requested"]]}, {"title": "Employee Acknowledgement of Handbook", "policies": [["8.1 Employee Acknowledgment of Handbook", "I acknowledge that I have received and reviewed the employee handbook. I\n\nunderstand and recognize that there may be changes to the information, policies, and benefits in the handbook. I understand that SUMMERSET ARF may add new policies to the handbook as well as replace, change, or cancel existing policies. I understand that I will be told about any handbook changes and I understand that\n\nhandbook changes can only be authorized by SUMMERSET ARF. management.\n\nI understand that I became an employee of SUMMERSET ARF. voluntarily. I understand and acknowledge that there is no specified length to my employment and that my employment is at will. I understand and acknowledge that \"at will\" means that I may terminate my employment at any time, with or without cause or advance notice. I also understand and acknowledge that \"at will\" means that the Company may terminate my employment at any time, with or without cause or\n\nadvance notice, if federal or state laws are not violated.\n\nI understand that it is my responsibility to read and comply with all policies included within the employee handbook. I further understand that I should consult\n\nmy supervisor and/or Administrator regarding any questions I may have."]]}];</script><script>const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const tabNames=['Welcome','Introduction','Employment','Records','Workplace','Benefits & Leave','Conduct','Payroll & Time','Acknowledgment'];
let current=0,done=[],lastPolicy=null;
try{done=JSON.parse(localStorage.getItem('summerset-full-handbook-v1')||'[]');if(!Array.isArray(done))done=[];done=done.filter(x=>Number.isInteger(x)&&x>0&&x<=8)}catch{}
const content=document.querySelector('#content');
function save(){try{localStorage.setItem('summerset-full-handbook-v1',JSON.stringify(done))}catch{}}
function update(){document.querySelector('#nav').innerHTML=sections.map((s,i)=>`<button data-go="${i}" class="${current===i?'active':''}" ${current===i?'aria-current="page"':''}><span class="number">${i===0?'⌂':done.includes(i)?'✓':String(i).padStart(2,'0')}</span>${esc(tabNames[i])}</button>`).join('');document.querySelector('#bar').style.width=(done.length/8*100)+'%';document.querySelector('#progress').textContent=`${done.length} of 8 sections reviewed`;}
function go(i,policy=null){current=i;lastPolicy=policy;document.querySelector('#search').value='';render();update();if(policy!==null){document.querySelector(`[data-policy="${policy}"]`)?.scrollIntoView({block:'start',behavior:'smooth'})}else{content.scrollIntoView({block:'start',behavior:'smooth'})}}
function format(text){text=text.replace(/^#{1,3}\s*$/gm,'');return text.split(/(<!-- Source PDF page \d+ -->)/g).map(t=>{const m=t.match(/<!-- Source PDF page (\d+) -->/);return m?`<span class="page-ref">Source PDF · page ${m[1]}</span>`:`<div class="policytext">${esc(t.trim())}</div>`}).join('')}
