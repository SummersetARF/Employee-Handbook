ition:relative;z-index:1;max-width:65%}h1{font:normal clamp(35px,4vw,56px)/1.08 Georgia,serif;letter-spacing:-1.7px;margin:15px 0 20px}h2{font:normal 31px/1.2 Georgia,serif;margin:0 0 15px}h3{font-size:19px;line-height:1.4}.hero p{font-size:15px;color:#655543;max-width:440px}.art{position:absolute;right:-10px;bottom:-9px;width:40%;height:100%;color:#aa4f24}.btn{border:0;border-radius:8px;padding:12px 19px;background:var(--orange);color:#fff;font-size:14px;font-weight:650}.btn.secondary{background:white;color:var(--ink);border:1px solid #d8cfc4}.btn:disabled{opacity:.45;cursor:default}.introline{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:32px 0 18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:left;color:var(--ink)}.card:hover{border-color:#c97a48;transform:translateY(-2px)}.card .icon{font-size:24px;color:var(--orange);display:block;margin-bottom:18px}.card h3{font-size:15px;margin:5px 0}.card p{font-size:13px;color:var(--muted);margin:0}.note{background:#fff4e9;border-left:3px solid #c8793e;padding:17px 20px;margin:26px 0;color:#72583e;font-size:13px}.reading{background:white;border:1px solid var(--line);border-radius:15px;padding:32px 36px}.reading p{line-height:1.85}.reading details{border-bottom:1px solid var(--line);padding:20px 0}.reading summary{cursor:pointer;font-weight:650;list-style-position:outside;margin-left:18px}.reading details p{color:#5e5852}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-top:25px;flex-wrap:wrap}.eyebrow{color:var(--orange);font-size:11px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:10px}.crumb{font-size:12px;color:var(--muted);margin-bottom:20px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#302c28;color:#fff;padding:12px 24px;border-radius:10px;z-index:4;box-shadow:0 5px 35px #0002}.completion{border:1px solid var(--line);background:#fff;padding:35px;border-radius:15px}.check{display:flex;gap:12px;align-items:flex-start;padding:20px 0}.check input{width:20px;height:20px;accent-color:var(--orange);margin-top:4px}.footer{margin-top:30px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}[hidden]{display:none!important}.result{width:100%;margin:6px 0}.reset{border:0;background:none;font-size:11px;color:var(--muted);padding:10px 0;text-decoration:underline}@media(max-width:800px){header{padding:0 6%;height:75px}.tag{display:none}main{padding:24px 6%}.layout{grid-template-columns:1fr;gap:24px}aside{position:static}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;padding:8px 12px}.search{margin-bottom:12px}.progressbox{margin-top:14px;padding:12px 16px}.hero{padding:28px;min-height:330px}.herotext{max-width:82%}.art{opacity:.3;width:48%}.cards{grid-template-columns:1fr}.card{padding:18px}.card .icon{margin-bottom:5px}.reading{padding:24px}.introline{align-items:flex-start}.footer{display:block}}
a.btn{display:inline-block;text-decoration:none}.page-ref{font-size:11px;color:var(--muted);display:block;margin:18px 0 8px}.section-tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.policytext{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.85;color:#514b45}.reading details{scroll-margin-top:20px}@media print{header,aside,.toolbar,.section-tools,.hero,.footer{display:none}main{padding:0}.layout{display:block}.reading{border:0;padding:0}.reading details{break-inside:auto}.reading details>*{display:block!important}} .nav button{font-size:14px;padding:10px 12px}.policy{padding:24px 0;border-bottom:1px solid var(--line);scroll-margin-top:24px}.policy:first-child{padding-top:0}.policy:last-child{border:0;padding-bottom:0}.policy h2{font:650 19px/1.5 system-ui,sans-serif;margin-bottom:18px}.toolbar{align-items:center;padding:18px 0}.toolbar .btn{min-width:120px}.resources{border:1px solid var(--line);background:#fff;border-radius:12px;padding:18px 22px}.resources summary{cursor:pointer;font-weight:650;font-size:14px}.resources a{color:var(--orange);font-size:13px}.reading{margin-top:25px}.page-ref{display:none}.policytext{white-space:pre-line}.search{font-size:13px}.progressbox .label{font-size:10px}@media(max-width:800px){.nav button{font-size:13px}.number{min-width:16px}.toolbar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:2}.toolbar .btn{min-width:95px}.hero{min-height:290px}.reading{padding:23px}} </style></head><body><header><div class="brand"><span class="sun" aria-hidden="true">☀</span><div>Summerset ARF<div class="tag">People. Care. Everyday.</div></div></div><span class="pill">Complete handbook</span></header><main><div class="layout"><aside><div class="label">Employee handbook</div><input class="search" id="search" aria-label="Search all handbook policies" placeholder="Search all handbook policies…"><nav class="nav" id="nav" aria-label="Handbook sections"></nav><div class="progressbox"><div class="label">Your reading progress</div><div class="track"><i id="bar"></i></div><div class="small" id="progress" aria-live="polite"></div><button class="reset" id="reset">Reset reading progress</button></div></aside><div><div class="crumb">Summerset ARF / Employee resources / Handbook</div><section id="content"></section><div class="footer"><span>Employee Handbook · Effective June 1, 2025</span><span>Acknowledgment in Synkwise</span></div></div></div></main><div id="toast" class="toast" role="status" hidden></div><script>const sections = [{"title": "Welcome", "policies": []}, {"title": "Introduction", "policies": [["1.1 Handbook Disclaimer", "The contents of this handbook serve only as guidelines and supersede any prior handbook. Neither this handbook, nor any other policy or practice, creates an employment contract, or an implied or express promise of continued employment with the Company. Employment with SUMMERSET ARF. is \"AT-WILL.\" This means employees or SUMMERSET ARF Inc. may terminate the employment relationship at any time, for any reason, with or without cause or advance notice. As an at-will employee, it is not guaranteed, in any manner, that you will be employed with\n\nSUMMERSET ARF. for any set period of time.\n\nThe Company also has the right, with or without notice, in an individual case or generally, to change any of the policies in this handbook, or any of its guidelines, policies, practices, working conditions or benefits at any time. No one is authorized to provide any employee with an employment contract or special arrangement concerning terms or conditions of employment unless the contract or arrangement\n\nis in writing and signed by the Administrator and the employee."], ["1.2 Welcome Message", "Dear Valued Employee,\n\nWelcome to SUMMERSET ARF. We are pleased with your decision to join our team\n\nSUMMERSET ARF is committed to providing superior quality and\n\n <!-- Source PDF page 7 -->\n\nunparalleled customer service in all aspects of our business. We believe each\n\nemployee contributes to the success and growth of our Company.\n\nThis employee handbook contains general information on our policies, practices, and benefits. Please read it carefully. If you have questions regarding the handbook,\n\nplease discuss them with your supervisor or the Administrator.\n\nWelcome aboard. We look forward to working with you!"], ["1.3 Changes in Policy", "Change at SUMMERSET ARF . is inevitable. Therefore, we expressly reserve the right to interpret, modify, suspend, cancel, or dispute, with or without notice, all or any part of our policies, procedures, and benefits at any SUMMERSET ARF\n\nand after those dates all superseded policies will be null and void.\n\nNo individual supervisor or manager has the authority to alter the foregoing. My employee who is unclear on any policy or procedure should consult a supervisor or\n\nthe Administrator"]]}, {"title": "General Employment", "policies": [["2.1 At-Will Employment", "Employment with SUMMERSET ARF is “at-will.\" This means employees are free to resign at any time, with or without cause, and SUMMERSET ARF ,may terminate\n\nthe employment relationship at any time, with or without cause or\n\n <!-- Source PDF page 8 -->\n\nadvance notice. As an at-will employee, it is not guaranteed, in any manner, that you will be employed with SUMMERSET ARF. for any set period of time.\n\nThe policies set forth in this employee handbook are the policies that are in effect at the time of publication. They may be amended, modified, or terminated at any time by SUMMERSET ARF except for the policy on at-will employment, which may be modified only by a signed, written agreement between the Administrator and the employee at issue. Nothing in this handbook may be construed as creating a promise of future benefits or a binding agreement between SUMMERSET ARF. and\n\nany of its emplo yees."], ["2.2 Immigration Law Compliance", "SUMMERSET ARF.is committed to employing only United States citizens and aliens who are authorized to work in the United States.\n\nIn compliance with the Immigration Reform and Control Act of 1986, as amended, each new employee, as a condition of employment, must complete the Employment Eligibility Verification Form 1-9 and present documentation establishing identity and employment eligibility. Former employees who are rehired must also complete the form if they have not completed an 1-9 with SUMMERSET ARF. within the past\n\nthree years, or if their previous 1-9 is no longer retained or valid.\n\nSUMMERSET ARF. may participate in the federal government's electronic\n\nemployment verification system, known as \"E- Verify.\" Pursuant to E-Verify,\n\nSUMMERSET ARF.\n\n <!-- Source PDF page 9 -->\n\nprovides the Social Security Administration, and if necessary, the Department of Homeland Security with information from each new employee's Form 1 -9 to confirm\n\nwork authorization."], ["2.3 Equal Employment Opportunity", "SUMMERSET ARF. is an Equal Opportunity Employer. Employment opportunities at\n\nSUMMERSET ARF. are based upon one's qualifications and capabilities to perform the essential functions of a particular job. All employment opportunities are provided without regard to race, religion, color, sex, national origin, age, military status, veteran status, disability, genetic information, ancestry, medical condition, marital status, gender identity, gender expression, sexual orientation, or\n\nany other characteristic protected by law.\n\nThis Equal Employment Opportunity policy governs all aspects of employment, including, but not limited to, recruitment, hiring, internships, selection, job assignment, promotions, transfers, compensation, discipline, termination, layoff, access to benefits and training, and all other conditions and privileges of\n\nemployment.\n\nSUMMERSET ARF . strongly urges the reporting of all instances of discrimination and harassment, and prohibits retaliation against any individual who reports discrimination, harassment, or participates in an investigation of such report. Upon a finding by the Company of a credible act(s) that violates this policy, appropriate\n\ndisciplinary action, up to and including immediate termination, will be\n\n <!-- Source PDF page 10 -->\n\ntaken against any employee who violates this policy."], ["2.4 Equal Employment Opportunity (California Employees)", "SUMMERSET ARF.is an E SUMMERSET ARF ,are based upon one's qualifications and capabilities to perform the essential functions of a particular job. All employment opportunities are provided without regard to race, religion, color, sex, national origin, age, military status, veteran status, disability, genetic information, ancestry, marital status, gender identity, gender expression, sexual\n\norientation, or any other characteristic protected by law.\n\nThis Equal Employment Opportunity policy governs all aspects of employment, including, but not limited to, recruitment, hiring, internships, selection , job assignment, promotions, transfers, compensation, discipline, termination, layoff, access to benefits and training, and all other conditions and privileges of\n\nemployment.\n\nSUMMERSET ARF strongly urges the reporting of all instances of discrimination and harassment, and prohibits retaliation against any individual who reports discrimination, harassment, or participates in an investigation of such report. Appropriate disciplinary\n\naction, up to and including immediate termination, will be taken against any employee\n\nwho violates this policy.\n\n <!-- Source PDF page 11 -->"], ["2.5 Employee Grievances", "It is the policy of SUMMERSET ARF. to maintain a harmonious workplace environment. SUMMERSET ARF. encourages its employees to express concerns about work-related issues, including workplace communication,\n\ninterpersonal conflict, and other working conditions.\n\nEmployees are encouraged to raise concerns with their supervisors. If not resolved at this level, an employee may submit, in writing, a signed grievance to the\n\nAdministrator.\n\nMer receiving a written grievance, SUMMERSET ARF. may hold a meeting with the employee, the immediate supervisor, and any other individuals who may assist in the investigation or resolution of the issue. All discussions related to the grievance\n\nwill be limited to those involved with, and who can assist with, resolving the issue.\n\nComplaints involving alleged discriminatory practices shall be processed in accordance with SUMMERSET ARF. Sexual and other Unlawful Harassment\n\nPolicy.\n\nSUMMERSET ARF. assures that all employees filing a grievance or complaint can do\n\nso without fear of retaliation or reprisal."], ["2.6 Internal Communication", "Effective and ongoing communication within SUMMERSET ARF. is\n\n <!-- Source PDF page 12 -->\n\nessential. As such, the Company maintains systems through which important\n\ninformation can be shared among employees and management.\n\nBulletin boards are posted in designated areas of the workplace to display SUMMERSET ARF . uses the Internet and email to facilitate communication and share access to documents. For information on appropriate email and Internet usage, employees may refer to the Computer, Email, and Internet Usage policy. To avoid confusion, employees should not remove any material from the bulletin\n\nboards unless directed to do so by a supervisor.\n\nAll employees are responsible for checking internal communications on a frequent and regular basis. Employees should consult their supervisor with any questions or\n\nconcerns on information disseminated."], ["2.7 Outside Employment", "Employees may hold outside jobs as long as the employee meets the performance standards of their position with SUMMERSET ARF.\n\nUnless an alternative work schedule has been approved by SUMMERSET ARF employees will be subject to the Company's scheduling demands, regardless of any existing outside work assignments; this includes availability for overtime when\n\nnecessary.\n\nSUMMERSET ARF. property, office space, equipment, materials, trade secrets,\n\nand any other confidential information may not be used for any purposes\n\n <!-- Source PDF page 13 -->\n\nrelating to outside employment."], ["2.8 Anti-Retaliation and Whistleblower Policy", "This policy is designed to protect employees and address SUMMERSET ARF. commitment to integrity and ethical behavior. In accordance with anti- retaliation and whistleblower protection regulations, SUMMERSET ARF ,will not\n\ntolerate any retaliation against an employee who:\n\nMakes a good faith complaint, or threatens to make a good faith complaint, regarding the suspected Company or employee violations of the law, including\n\ndiscriminatory or other unfair employment practices;\n\nMakes a good faith complaint, or threatens to make a good faith complaint, regarding accounting, internal accounting controls, or auditing matters that may\n\nlead to incorrect, or misrepresentations in, financial accounting;\n\nMakes a good faith report, or threatens to make a good faith report, of a violation that endangers the health or safety of an employee, patient, client or customer, resident,\n\nenvironment or general public;\n\nObjects to, or refuses to participate in, any activity, policy or practice, which\n\nthe employee reasonably believes is a violation of the law;\n\nProvides information to assist in an investigation regarding violations of the law; or\n\nFiles, testifies, participates or assists in a proceeding, action or hearing in\n\nrelation to alleged violations of the law.\n\nRetaliation is defined as any adverse employment action against an employee,\n\n <!-- Source PDF page 14 -->\n\nincluding, but not limited to, refusal to hire, failure to promote, demotion, suspension, harassment, denial of training opportunities, termination, or\n\ndiscrimination in any manner in the terms and conditions of employment.\n\nAnyone found to have engaged in retaliation or in violation of law, policy or practice will be subject to discipline, up to and including termination of employment. Employees who knowingly make a false report of a violation will be subject to\n\ndisciplinary action, up to and including termination.\n\nEmployees who wish to report a violation should contact their supervisor or the Administrator directly. Employees should also review their state and local\n\nrequirements for any additional reporting guidelines.\n\nSUMMERSET ARF. will promptly and thoroughly investigate and, if necessary, address any reported violation.\n\nEmployees who have any questions or concerns regarding this policy and related reporting requirements should contact their supervisor, the Administrator or any\n\nstate or local agency responsible for investigating alleged violations."], ["2.9 Licensing and Certification", "SUMMERSET ARF. is required by law to attain certification of any employee whose duties require federal, state, or agency licensing. Therefore, all individuals that fall under this category must be able to present verifiable proof prior to their starting\n\ndate that such requirements have been met.\n\nEmployees must also agree that their licenses and/or certifications will be maintained and kept current for the duration of their employment with the\n\nCompany.\n\n <!-- Source PDF page 15 -->\n\nFailure to present or retain certification may result in disciplinary action, up to and including termination of employment.\n\nQuestions regarding this policy should be directed to the Administrator."]]}, {"title": "Employment Status & Recordkeeping", "policies": [["3.1 Employment Classifications", "All new employees are provided with a ninety-day Orientation/Training period. This period is designed to provide new employees with an opportunity to become acquainted with their job and facility policies, as well as, licensing requirements. New employees will receive a formal evaluation of their job performance, conducted by the Administrator. During this evaluation, the Administrator will review the\n\nemployee's progress and establish goals.\n\nA regular employee is any employee who has satisfactorily completed their\n\norientation period and who has been hired for an indefinite period of time.\n\nA full-time regular employee is any employee who is regularly scheduled to work\n\nmore than 30 hours per week.\n\nA part-time regular employee is any employee who is regularly scheduled to work\n\n33 hours per week or less.\n\nAn on-call employee is one who is scheduled to work to replace an employee on leave, work with the facility because the facility census has increased to require additional staff, or when resident care needs increase and require additional\n\nstaff.\n\nA probationary employee is any employee regardless of the number of scheduled\n\n <!-- Source PDF page 16 -->\n\nwork hours who has not satisfactorily completed their ninety-\n\nday orientation/probation period."], ["3.2 Personnel Data Changes", "It is the responsibility of each employee to promptly notify their supervisor or the Administrator of any changes in personnel data. Such changes may affect your\n\nreceipt of important company information.\n\nIf any of the following have changed or will change in the coming future, contact your\n\nsupervisor or the Administrator as soon as possible:\n\n+ Legal name\n\n* Mailing address\n\n* Telephone number(s)\n\n¢ Exemptions on your tax forms\n* Emergency contact(s)\n\n* Training certificates\n\n* Professional licenses"], ["3.3 Live Scan Clearance and Reimbursement", "Live scan clearances by the FBI and Department of Justice are a condition of employment for all employees. It is the policy of this company that prospective employees pay for the cost of any required live scan. This cost is paid to an outside\n\nagency. If prospective employees are officially hired, work for the Company at least\n\n <!-- Source PDF page 17 -->\n\nsixty days, and work all of their scheduled shifts during this period, the Company\n\nwill reimburse the employee for the cost of the live scan, not to exceed $81.00."], ["3.4 Termination of Employment", "Termination of employment is an inevitable part of personnel activity within any organization, and many of the reasons for termination are routine. Common\n\ncircumstances under which employment is terminated include the following:\n\n* Resignation - Voluntary employment termination initiated by an employee.\n\n* Termination - Involuntary employment termination initiated by\nSUMMERSET ARF. In most cases, SUMMERSET ARF. will use\nprogressive disciplinary actions before dismissing an employee. However, in\nthe sole discretion of the Administrator, certain actions warrant immediate\n\ntermination and progressive disciplinary actions are not an option.\n\n¢ Layoff - Involuntary employment termination initiated by\nSUMMERSET ARF. for non-disciplinary reasons.\n\n¢ Retirement - Voluntary employee termination upon eligibility for retirement.\n\nEmployees who intend to terminate employment with SUMMERSET ARF Services, Inc., shall provide SUMMERSET ARF. with at least two weeks of written notice. Such notice is intended to allow the Company time to adjust to the employee's departure without placing undue burden on those employees who may be required\n\nto fill in before a replacement can be found.\n\nSince employment with SUMMERSET ARF.is based on mutual consent, both the employee and SUMMERSET ARF. have the right to terminate\n\n <!-- Source PDF page 18 -->\n\nemployment at-will, with or without cause, at any time.\n\nIn the case of employee termination, the employee will receive their accrued pay in\n\naccordance with all federal, state and local laws.\n\nAny employee who terminates employment with SUMMERSET ARF shall return all files, records, keys, and any other materials that are the property of SUMMERSET ARF\n\nIf you have any questions or concerns regarding this policy, direct them to the\n\nAdministrator."], ["3.5 Incident Reports", "In the event of an incident, the employee must complete an incident report on the appropriate incident report form and notify their immediate supervisor prior to\n\nleaving their assigned shift."]]}, {"title": "Working Conditions & Hours", "policies": [["4.1 Company Hours", "SUMMERSET ARF. ensures staff coverage for the benefit of our residents daily for\n\ntwenty-four hour periods. This includes holiday\n\nEmployees are advised electronically of their scheduled shifts, including starting and ending times. Business needs may necessitate a variation in your starting and ending times as well as in the total hours you may be scheduled to work each day\n\nand each week.\n\n <!-- Source PDF page 19 -->"], ["4.2 Emergency Closing", "At times, emergencies such as severe weather, fires, or power failures can disrupt company operations. In extreme cases, these circumstances may require the closing of a work facility. The decision to close or delay regular operations will be\n\nmade by SUMMERSET ARF. management.\n\nWhen a decision is made to close facilities, employees will receive official\n\nnotification from their supervisor and/or the Administrator."], ["4.3 Workplace Safety", "SUMMERSET ARF is committed to providing a clean, safe, and healthful work\n\nenvironment for its employees.\n\nMaintaining a safe work environment, however, requires the continuous cooperation of all employees. SUMMERSET ARF. and all employees must com ply with all occupational safety and health standards and regulations established by the Occupational Safety and Health Act and state and local regulations. In addition, all employees are expected to obey safety rules and exercise caution and common\n\nsense in all work activities.\n\nComplaint and Reporting Procedure:\n\n <!-- Source PDF page 20 -->\n\nEmployees should immediately report any unsafe conditions to their supervisor without fear of reprisal. In the case of an accident that results in injury, regardless of how seemingly insignificant the injury may appear, employees must notify their supervisor. If you believe it would be inappropriate to report the matter to your\n\nsupervisor, you can report it directly to:\n\nAnderson Munoz\n\n504 W Avenue H-13, Lancaster, CA 93534\n\n(818) 687-3830\n\nEmail: munozanderson23@yahoo.com\n\nEmployees who violate safety standards, cause hazardous or dangerous situations, or fail to report or, where appropriate, remedy such situations may be\n\nsubject to disciplinary action, up to and including termination of employment.\n\nRetaliation Prohibited:\n\nSUMMERSET ARF. expressly prohibits retaliation against anyone who reports unsafe working conditions or work-related accidents, injuries or illnesses. Any form of retaliation\n\nwill be subject to disciplinary action, up to and including termination of employment.\n\nQuestions or concerns regarding this policy should be directed to your supervisor or the Administrator."], ["4.4 Security", "<!-- Source PDF page 21 -->\n\nFacility Access:\n\nRegular SUMMERSET ARF. employees may be issued a key to gain access to SUMMERSET ARF. Employees who are issued keys are responsible for their\n\nsafekeeping. All lost or stolen keys must be reported to your supervisor as soon\n\nas possible.\n\nUpon separation from SUMMERSET ARF and at any other time upon SUMMERSET ARF. request, all keys must be returned to your supervisor.\n\nClosing Procedures:\n\nThe last employee, or a designated employee, who leaves any Company facility at any time assumes the responsibility to ensure that: all doors are securely locked; the alarm system is armed; thermostats are set on appropriate temperatures; and\n\nall appliances and lights are turned off.\n\nEmployees are not permitted on company property outside of their scheduled shifts\n\nwithout prior written authorization from the Administrator."], ["4.5 Meal & Break Periods (California Employees)", "Depending on the length of an employee's shift: (a) He or she may or may not be required to take a meal break\n\n(b) He or she may or may not waive a meal\n\nas outlined in this policy.\n\n <!-- Source PDF page 22 -->\n\nMeal Periods Depending on: (a) the length of an employee's shift, as well as,\n\n(b) regulatory and/or approved standards for a residential facility\n\nan employee mayor may not be entitled to meal period.\n\nDescription:\n\nMeal Period: a 30-minute break that is unpaid. The employee is totally free of job responsibilities and may leave the premises for that 30 minutes, if the employee so\n\ndesires. The employee is not permitted to work during the 30-minute meal period.\n\nEmployee is responsible for clocking out and clocking in at the beginning and\n\nending of the unpaid lunch period.\n\nLicensee for Residential Facilities: SUMMERSET ARF.\n\nOn Duty Meal Period: A meal period in which the employee is not totally free of job responsibilities is a on duty meal period and the employee is paid for this on duty meal. Some people may call it a \"a working lunch\". The employee does not clock in and out. The employee does not leave the premises. The employee may eat\n\nwith the residents, if the employee desires to do so.\n\nFor an on-duty meal period to be valid:\n\n(a) The work for that shift prevents the employee from being relieved of all duty; and\n\n(b) There is a written agreement between the employee and SUMMERSET ARF. Allowing for a on duty meal period. The agreement is called an On-Duty Meal Period\n\nby SUMMERSET ARF..\n\n <!-- Source PDF page 23 -->\n\nThe employee does not clock out and in at the beginning of the paid meal period.\n\nDue to regulatory and/or approved standards for a residential SUMMERSET ARF an employee may not be entitled to a 30-minute unpaid meal period for many reasons during his/her shift. (i.e. unanticipated staffing problems, resident's care during that time will not allow employee to be totally relieved of job\n\nresponsibilities, etc.)\n\nWaiver: This is the written agreement between the employee and SUMMERSET\n\nARF. allowing an employee to waive a meal period for a five (5) or six (6) hour shift.\n\nRevocation of Waiver A waiver may be revoked at any time by written notice to SUMMERSET ARF.\n\nRe-signing of Waiver: In the event an employee signs a waiver and then revokes it in writing, and then wants to waive a meal, the employee and SUMMERSET ARF.\n\nmust sign another waiver.\n\nTime For Lunch: No work period of an employee may exceed 5 hours without a meal period. This meal period maybe paid or unpaid. No employee may waive a meal period within one (1) to five (5) hours of work unless the employee's work shift is six\n\n(6) hours total.\n\nThe employee is also not allowed to waive a meal period during a five (5) or six (6)\n\nhour shift for the employee's convenience, such a going home early.\n\nShifts of 7 hours-10 hours or more (2nd Meal Break): This section applies after the first (1st) meal break was provided in the first (1st) five hours. The 2nd meal break is to begin starting at 8 % hours but not later than 9 % hours and before the\n\nemployee starts the 11th hour. Meal break must be a minimum of 30 minutes.\n\n <!-- Source PDF page 24 -->\n\nBreak Periods\n\nEach employee must take one 10-minute break for each four (4) hours worked. Employees working no more than 3 ’% hours are not required to take to a break. Breaks should be taken, if possible, at or around the middle of your shift. If for any\n\nreason, an emergency interrupts your break, you are entitled to an uninterrupted\n\nbreak.\n\nAll break period are paid the normal hourly rate of that employee.\n\nEmployees on the same shift should cooperate with each other, in order to assure\n\nthat each employee receives a 10-minute break.\n\nPlease note the suggested standard below:\n\nNumber of Hours Worked in Day Number of Rest Periods\n\n0-3.5 0) 3.5-6 1 6-10 2 10-14 3 14-18 4 ###"], ["4.6 Parking", "SUMMERSET ARF. does not maintain private parking facilities for employees. Employees may not park their personal vehicles in the driveways of the licensed\n\nfacilities. Personal vehicle must also not block facility driveways.\n\nSUMMERSET ARF. employees are expected to comply with all local parking\n\nregulations and will be responsible for any fines incurred for violations.\n\n <!-- Source PDF page 25 -->"], ["4.7 Workplace Recording", "This policy is intended to provide guidelines concerning employees' use of video\n\nenabled devices in the workplace and the Company's use of video surveillance.\n\nUse of Video Enabled Devices:\n\nIn general, SUMMERSET ARF. prohibits video recording except when specifically requested by the supervisor/house manager and/or Administrator\n\nto document and/or memorialize a particular situation and/or incident.\n\nThe exception to the above policy applies to special occasions with residents such as birthdays, special dinners, outings, and celebrations. Employees may record\n\nevents such as these as long as the recording does not violate any resident's right to privacy, dignity, and confidentiality. Employees are prohibited from sharing any\n\nrecordings of residents publicly, such as on social media.\n\nInfringing on employees' or residents’ expected rights to privacy by videotaping in\n\nrestrooms, bedrooms or other private areas is grounds for immediate termination.\n\nVideo Surveillance:\n\nIn order to promote safety and security, SUMMERSET ARF. reserves the right to install video cameras in common areas, including living rooms, family rooms, parking lots, yards, medication administration areas and garages. Video surveillance is designed to help protect people, residents and ascertain unlawful\n\nand/or inappropriate behavior on Company property.\n\nIn accordance with federal law, video surveillance does not contain an audio\n\ncomponent. Additionally, there will be no video surveillance or video recordings in\n\n <!-- Source PDF page 26 -->\n\nprivate areas, such as restrooms. Recorded video will be stored in a secure\n\nlocation and accessed only by authorized personnel.\n\nQuestions regarding this policy should be directed to your immediate supervisor or\n\nthe Administrator."], ["4.8 Dress Code", "As an employee, you represent both yourself and the Company to our residents, their families, various agencies and the community. You are therefore, expected to be appropriately dressed, neat, clean and groomed in accordance with the requirements of your position. Employees should always dress in a manner befitting the job, with due consideration to the needs of the Company, other\n\nemployees, our clients, behaviors that may emerge, and safety.\n\nClothing Requirements. An employee's clothing should always be in keeping with customary acceptable attire for adult residential facilities. Clothing that is not allowed to be worn by Employees while working includes, but is not limited to,\n\nthe following:\n\n4.8.1 shirts with language or graphics that are vulgar, sexually explicit, or\n\nmay otherwise be offensive\n\n4.8.2 attire that is revealing or provocative\n4.8.3 flip-flops or any type of loose footwear\n4.8.4 see-through blouses or shirts\n\n4.8.5 sports bras, halter tops, or similar attire\n4.8.6 tank tops\n\n4.8.7 clothing that allows bare midriffs\n\n <!-- Source PDF page 27 -->\n\n4.8.8 open-toed shoes\n\n4.8.9 loose clothing.\n\nJewelry must be kept to a minimum. Dangling jewelry that can cause harm or can\n\nbe easily grabbed by clients is not permitted.\n\nIn the event that the above policy causes religious concerns or concerns based upon any other legally protected class, please contact the Administrator to discuss\n\nan appropriate religious accommodation."], ["4.9 Communicable Diseases", "Any employee with symptoms or signs of a communicable disease, such as tuberculosis, severe cold, influenza, infected skin lesions, open draining sores, are not allowed to remain on duty. Employees with any such ailment maybe required to have a written release from a physician and/or a health screening in accordance with applicable laws prior to returning to work. All other health incidents involving a communicable disease are managed according to applicable State and Federal\n\nlaws."], ["4.10 Meal & Break Periods", "In accordance with state and local laws, non-exempt employees will be provided with meal and break periods. Break periods of less than 20 minutes will be paid.\n\nBreak periods lasting longer than 20 minutes will be unpaid.\n\nNon-exempt employees must be fully relieved of their job responsibilities and are\n\nnot permitted to work during unpaid break and meal periods of more than 20\n\n <!-- Source PDF page 28 -->\n\nminutes.If for any reason a non-exempt employee does not take the applicable meal and rest period that they are provided, the employee must notify his or her\n\nsupervisor immediately.\n\nSUMMERSET ARF will schedule meal and break periods in order to accommodate\n\nCompany operating requirements."], ["4.11 Break Time for Nursing Mothers", "SUMMERSET ARF. accommodates employees who wish to express breast milk during the workday by providing reasonable break times to do so. The Company will provide a designated room, other than a bathroom, that is shielded from view, free from intrusion from coworkers and the public and is in compliance with all\n\nother applicable laws for this purpose.\n\nEmployees who use regularly scheduled rest breaks to express breast milk will be paid for the break time. If the lactation break does not run concurrently with the employees regularly scheduled compensated break, the lactation break will be\n\nunpaid.\n\nFor questions related to this policy, please contact the Administrator."]]}, {"title": "Employee Benefits", "policies": [["5.1 Holidays", "SUMMERSET ARF. observes the following paid holidays:\n\n <!-- Source PDF page 29 -->\n\n« New Year's Day\n* Thanksgiving Day\n\n* Christmas Day\n\nDue to the nature of our business, SUMMERSET ARF. may require employees to work on holidays. Employees required to work on holidays will be paid holiday pay\n\nin accordance with applicable laws\n\nEligible Employees:\n\nTo be eligible for unpaid time off each employee must work 90 days and must work\n\none holiday every four months.\n\nBasic Leave Entitlement:\n\nEligible employees may take up to 24 hours or 3 days (whichever is more) of accrued unpaid sick leave per year for:\n\n5.1.1 The diagnosis, care, or treatment of an existing health condition\nof, or preventive care for, an employee or an employee's family\n\nmember; or\n\n5.1.2 To attend legal proceedings, or to obtain care, counseling or other\n\nvictims’ services for domestic violence, sexual assault, or stalking.\n\nNotice:\n\nTo the extent possible, employees must provide reasonable advance notice of their\n\nneed for leave under this policy. If the need for leave is not foreseeable, an\n\n <!-- Source PDF page 30 -->\n\nemployee must provide notice as soon as practicable."], ["5.2 Jury Duty", "SUMMERSET ARF. encourages employees to fulfill their civic responsibilities when called upon to serve as a juror. Employees must provide their immediate supervisor with a copy of their jury summons as soon as possible so that the supervisor may\n\nmake arrangements to accommodate their absence.\n\nEmployees on jury duty must report to work on workdays, or parts of workdays, when they are not required to serve. Either SUMMERSET ARF. or the employee may request an excuse from jury duty if it is determined that the employee's\n\nabsence would create serious operational difficulties.\n\nThis Company does not pay employees to perform jury duty."], ["Workers' Compensation", "Employees who are injured on the job at SUMMERSET ARF. are eligible for Workers' Compensation benefits. Such benefits are provided at no cost to employees and cover any injury or illness sustained in the course of employment\n\nthat requires medical treatment.\n\nLost time or medical expenses incurred as a result of an accident or injury which occurred while an employee was on the job will be compensated for in accordance with workers' compensation laws. This protection is paid for in full by SUMMERSET ARF No premium is charged for this coverage and no individual enrollment is required. SUMMERSET ARF. will provide medical care and a portion of lost wages\n\nthrough our insurance carrier.\n\n <!-- Source PDF page 31 -->\n\nAll job-related accidents or illnesses must be reported to the supervisor immediately upon occurrence. Supervisors will then immediately contact the\n\nAdministrator to obtain the required claim forms and instructions."], ["5.3 Crime Victims Leave (California Employees)", "AA employee may be entitled to leave if the employee, or his or her immediate family member, is a victim of a serious or violent felony, or a felony related to theft or embezzlement. Such leave maybe taken to attend legal and court proceedings related to the crime. For purposes of this policy, immediate family member means spouse, registered domestic partner, child, child of registered domestic partner,\n\nstepchild, sibling, stepbrother, stepsister, parent, and stepparent.\n\nThe employee must SUMMERSET ARF. with a copy of the notice of each scheduled proceeding that is provided to the victim, unless advance notice is not feasible. When advance notice is not feasible, the employee must be prepared to provide SUMMERSET ARF. with certification of the judicial proceeding from the proper authority within a reasonable time following the leave. The documentation may be from the court or government agency setting the hearing, the district attorney or prosecuting attorney's office, or the victim/witness office that is\n\nadvocating on behalf of the victim.\n\nCrime victims leave is unpaid."], ["5.4 Domestic Violence Leave (California Employees)", "An employee maybe entitled to a reasonable amount of leave if the employee is a\n\n <!-- Source PDF page 32 -->\n\nvictim of domestic violence, sexual assault or stalking. This leave may be used:\n\n*« To seek medical attention for injuries caused by domestic violence, sexual\n\nassault or stalking;\n\n* To obtain services from a domestic violence shelter, program, or crisis\n\ncenter as a result of domestic violence, sexual assault or stalking;\n\n* To obtain psychological counseling related to an experience of domestic\n\nviolence, sexual assault or stalking; or\n\n* To participate in safety planning and take other actions to increase\nsafety from future domestic violence, sexual assault or stalking, including\n\ntemporary or permanent relocation.\n\nExcept in cases of imminent danger to the health or safety of the employee, or unless impractical, an employee requesting domestic violence leave must provide\n\nhis or her supervisor with reasonable notice prior to the need for leave.\n\nEmployees must be prepared to provide SUMMERSET ARF. with certification to verify the employee's eligibility for the leave requested, such as a police report, a court order, or documentation from a medical professional, domestic violence\n\nadvocate, health care provider, or counselor.\n\nDomestic violence leave is unpaid."], ["5.5 Voting Leave (California Employees)", "SUMMERSET ARF. requests that, whenever possible, employees vote before or after work hours to avoid interference with business operations. However, if an\n\nemployee does not have sufficient time outside of work hours to cast his or her\n\n <!-- Source PDF page 33 -->\n\nballot, the employee may be eligible for up to two hours of paid time off to vote\n\non Election Day.\n\nSUMMERSET ARF. may specify the hours during which the employee may take leave to vote. Such time will generally be limited to the beginning or end of a working shift, whichever allows the most time for voting and the least time off from a regular working shift, unless otherwise mutually agreed.\n\nTo the extent possible, employees must provide at least two working days' notice of\n\ntheir need for leave under this policy.\n\nEmployees must be prepared to provide SUMMERSET ARF Inc. with certification,\n\nsuch as a voter's receipt, to prove that he or she voted."], ["5.6 Pregnancy Disability Leave & Pregnancy Accommodation (California Employees)", "Employees who are temporarily disabled because of pregnancy, childbirth, or\n\nrelated medical conditions may take up to 4 months of leave either before or after\n\nchildbirth.\n\nIntermittent or Reduced Schedule Leave:\n\nLeave may be taken on an intermittent basis or the employee may work a reduced work schedule if advised by their health care provider. SU\\MMERSET ARF. may require the employee to transfer temporarily to an alternative position with\n\nequivalent pay that would better accommodate recurring periods of leave.\n\n <!-- Source PDF page 34 -->\n\nNotice:\n\nTo the extent possible, employees must provide 30 days advance notice of their need for leave under this policy. SUMMERSET: ARF will respond to the request made by the employee as soon as practical but no later than 10 days after receiving the request. SUMMERSET ARF will make every effort to respond to such\n\nrequest prior to the date leave is due to begin. Medical Certification:\n\nEmployees must be prepared to provide SUMMERSET ARF. with medical certification by a health care provider to verify the employee's eligibility for the\n\nleave requested . Reasonable Accommodation:\n\nEmployees who are limited in their abilities to perform their jobs because of pregnancy, childbirth , and related medical conditions may request a reasonable accommodation as is necessary. Reasonable accommodations include, but are\n\nnot limited to:\n\n* Modifying work duties, practices or policies\n\n* Modifying work schedules\n\n* More frequent breaks\n\n* Transfer to a less strenuous position\n\n* Providing furniture, or acquiring or modifying equipment or devices\n* Providing a reasonable amount of break time to express breast milk\n\n* Time off to recover from pregnancy, childbirth or related medical condition\n\nCompensation\n\n <!-- Source PDF page 35 -->\n\nLeave under this policy is unpaid; however, employees may use accrued paid time\n\noff for this purpose.\n\nReturn to Work:\n\nEmployees returning from leave will be reinstated to the same position or a comparable position to the position held when leave began unless doing so is not possible due to legitimate business reasons unrelated to the employee taking such leave. Employees may be required to submit a release to return to work and/or a\n\nnew health screening as required by law from their health care provider.\n\nQuestions Regarding this Policy:\n\nSUMMERSET ARF. will not retaliate against an employee for requesting or using leave or a reasonable accommodation under this policy. Employees should speak with the Administrator to discuss their need for leave or reasonable\n\naccommodation, or if they have questions about this policy."], ["5.7. Paid Family Leave (California Employees)", "Employees in California are eligible for up to 6 weeks of wage replacement benefits within a 12-month period from the State of California for absences from work for the\n\nfollowing reasons:\n\n5.7.1 To care for a child, spouse, domestic partner, parent, parent-in-\nlaw, grandparent, grandchild or sibling with a serious health\n\ncondition;\n\n5.7.2 To bond with a new child; or\n\n5.7.3 To bond with a new child in connection with the adoption or foster\n\ncare placement of that child.\n\n <!-- Source PDF page 36 -->\n\nEmployees must provide a medical certification when filing a Paid Family Leave\n\nclaim to provide care for a seriously ill family member.\n\nPaid Family Leave is limited to the first year after the birth, adoption or foster\n\ncare placement of a child.\n\nCalifornia Paid Family Leave does not provide employees with job protection. Rather, eligible employees are entitled to receive certain paid benefits from the State of\n\nCalifornia if the employee is absent from work for the reasons stated above.\n\nThe State of California will determine whether you are eligible for Paid Family Leave benefits, including the amount of benefits you may receive. Your entitlement to benefits is subject to the terms and conditions established by the State of\n\nCalifornia.\n\nGenerally, employees entitled to leave under the federal Family and Medical Leave Act, the California Family Rights Act, or the New Parent Leave Act must take Paid\n\nFamily Leave concurrently with leave taken under those acts.\n\nEmployees who are interested in any additional information about these\n\nbenefits should contact the Administrator."], ["5.8 Military Leave", "SUMMERSET ARF. grants employees unpaid time off for service, training and other obligations in the uniformed services in accordance with the Uniformed\n\nServices Employment and Reemployment Rights\n\nAct (USERRA) and any other applicable state law.\n\n <!-- Source PDF page 37 -->\n\nAll employees requesting time off for military service must provide advance notice to their immediate supervisor, unless military necessity prevents such notice, or it is otherwise impracticable. Continuation of health insurance benefits is available during military leave subject to the terms and conditions of the group health plan\n\nand applicable law.\n\nEmployees are eligible for reemployment for up to five years from the date their military leave began. The period an individual must apply for reemployment or report back to work after military service is based on time spent on military duty\n\nand on applicable law. For reinstatement guidelines, contact the Administrator.\n\nEmployees who qualify for reemployment will return to work at a pay level and status equal to that which they would have attained had they not taken military leave. They will be treated as though they were continuously employed for purposes of\n\ndetermining benefits based on length of service.\n\nSUMMERSET ARF. complies with all rights and protections under all applicable state laws granting time off for service, training and other obligations in the uniformed services. This includes, but is not limited to, benefits entitlement and continuation, notice and recertification requirements, and reemployment\n\napplication requirements.\n\nQuestions regarding this policy should be directed to the Administrator."]]}, {"title": "Employee Conduct", "policies": [["6.1 Standards of Conduct", "SUMMERSET ARF. rules and standards of conduct are essential to a productive work environment. As such, employees must familiarize themselves with, and be\n\nprepared to follow, the Company's rules and standards.\n\n <!-- Source PDF page 38 -->\n\nWhile not intended to be an all-inclusive list, the examples below represent behavior that is considered unacceptable in the workplace. Behaviors such as these, as well as other forms of misconduct, may resultin disciplinary action, up to\n\nand including termination of employment:\n\n6.1.1. Theft or inappropriate removal/possession of property\n6.1.2 Falsification of timekeeping records\n6.1.3. Possession, distribution, sale, transfer, manufacture or use of\nalcohol or illegal drugs in the workplace\n6.1.4 Fighting or threatening violence in the workplace\n6.1.5 Making maliciously false statements about co-workers\n6.1.6 Threatening, intimidating, coercing, or otherwise interfering with\nthe job performance of fellow employees or visitors\n6.1.7 Negligence or improper conduct leading to damage of company-\nowned or customer-owned property\n6.1.8 Violation of safety or health rules\n6.1.9 Smoking in non-smoking areas. Smoking is only allowed in the backyard.\n6.1.10 Cannabis\n6.1.11 Sexual or other unlawful or unwelcome harassment\n6.1.12 Excessive absenteeism\n6.1.13 Unauthorized use of telephones, computers, or other company-owned\nequipment on working time. Working time does not include break periods,\n\nmeal times, or other specified periods during the workday when employees\n\nare not engaged in performing their work tasks.\n\n6.1.14 Unauthorized disclosure of any \"business secrets\" or other\nconfidential or non-public proprietary information relating to the\n\nCompany's products, services, customers or processes.\n\n <!-- Source PDF page 39 -->\n\n6.1.15 Improper and/or negligent care of residents.\n\n6.1.16 Falsification of records and/or information submitted to Company\n\n6.1.17 Sleeping during working time\n\nOther forms of misconduct not listed above may also result in disciplinary action, up to and including termination of employment. If you have questions regarding SUMMERSET ARF. standards of conduct, please direct them to your supervisor or\n\nthe Administrator."], ["6.2 Disciplinary Action", "Disciplinary action at SUMMERSET ARF. is intended to fairly and impartially\n\ncorrect behavior and performance problems early on and to prevent reoccurrence.\n\nDisciplinary action may involve any of the following: verbal warning, written warning, suspension with or without pay, and termination of employment, depending on the severity of the problem and the frequency of occurrence. SUMMERSET ARF. reserves the right to administer disciplinary action at its discretion and based upon\n\nthe circumstances.\n\nSUMMERSET ARF. recognizes that certain types of employee behavior are serious enough to justify termination of employment, without observing other\n\ndisciplinary action first.\n\nThese violations include but are not limited to:\n\n¢ Workplace violence\n« Harassment\n\n¢ Theft of any kind\n\n <!-- Source PDF page 40 -->\n\n*  Insubordinate behavior\n* Vandalism or destruction of company property\n\n* Presence on company property during non-scheduled hours\n\n¢ Use of company equipment and/or company vehicles without prior\n\nauthorization\n\n*  Falsification of information regarding personal work history, skills, or training\n\n* Divulging SUMMERSET ARF. business practices or any other\n\nconfidential information\n\n* Any misrepresentation of SUMMERSET ARF.to a customer, a\n\nprospective customer, the general public, or an employee\n\n* Malicious and/or harmful treatment of a resident"], ["6.3 Confidentiality", "SUMMERSET ARF. takes the protection of Confidential Information very seriously. \"Confidential Information\" includes, but is not limited to, computer processes, computer programs and codes, resident listings and information, client lists, client preferences, clients' personal information, company financial data, marketing strategies, proprietary production processes , research and development strategies, pricing information , business and marketing plans, vendor information, software, databases, and information concerning the creation, acquisition or disposition of\n\nproducts and services.\n\nConfidential Information also includes the Company's intellectual property and information that is not otherwise public. Intellectual property includes, but is not limited to, trade secrets, ideas, discoveries, writings, trademarks, and inventions\n\ndeveloped through the course of your employment with SUMMERSET ARF\n\n <!-- Source PDF page 41 -->\n\nand as a direct result of your job responsibilities with SUMMERSET ARF .To protect such information, employees may not disclose any confidential or non-- public proprietary information about the Company to any unauthorized individual. If you receive a request for Confidential Information, you should immediately refer the request\n\nto your supervisor.\n\nThe unauthorized disclosure of Confidential Information belonging to the Company, and not otherwise available to persons or companies outside of SUMMERSET ARF, may result in disciplinary action, up to and including termination of employment. If you leave the Company, you may not disclose or misuse any\n\nConfidential Information.\n\nQuestions regarding this policy should be directed to the Administrator."], ["6.4 Workplace Violence", "SUMMERSET ARF. strictly prohibits\n\nworkplace violence, including any act of intimidation, threat, harassment, physical violence, verbal abuse, aggression or coercion against a coworker, vendor,\n\ncustomer, or visitor.\n\nProhibited actions, include, but are not limited to the following exam pies:\n\n6.4.1 Physically injuring another person\n6.4.2 Threatening to injure another person\n6.4.3. Engaging in behavior that subjects another person to emotional distress\n\n6.4.4 Using obscene, abusive or threatening language or gestures\n\n <!-- Source PDF page 42 -->\n\n6.4.5 Bringing an unauthorized firearm or other weapon onto company\nproperty\n\n6.4.6 Threatening to use or using a weapon while on company premises,\n\non company-related business, or during job-related functions\n\n6.4.7 Intentionally damaging property\n\nAll threats or acts of violence should be reported immediately to your supervisor or security personnel. Employees should warn their supervisors or security personnel\n\nof any suspicious workplace activity that they observe or that appears problematic.\n\nEmployee reports made pursuant to this policy will be investigated promptly and will be kept confidential to the maximum extent possible. SUMMERSET ARF will not tolerate any form of retaliation against any employee for making a report under this\n\npolicy.\n\nSUMMERSET ARF. will take prompt remedial action, up to and including immediate termination, against any employee found to have engaged in threatening\n\nbehavior or acts of violence."], ["6.5 Drug & Alcohol Use", "SUMMERSET ARF.is committed to maintaining a workplace free of substance abuse. No employee or individual who performs work for SUMMERSET ARF.is allowed to consume, possess, sell, purchase, or be under the influence of alcohol, marijuana and/or illegal drugs, as defined by federal law, on any property owned by or leased on behalf of SUMMERSET ARF. Services, Inc., or in any vehicle owned\n\nor leased on behalf of SUMMERSET ARF. or while on Company business.\n\n <!-- Source PDF page 43 -->\n\nThe use of over-the-counter drugs and legally prescribed drugs is permitted as long as they are used in the manner for which they were prescribed and provided that such use does not hinder an employee's ability to safely perform his or her job. Employees should inform their supervisor if they believe their medication will impair their job performance, safety or the safety of others, or if they believe they need a\n\nreasonable accommodation when using such medication.\n\nSUMMERSET ARF will not tolerate employees who report for duty while impaired by the use of alcohol or drugs. All employees should report evidence of alcohol or drug abuse to their supervisor or the Administrator immediately. In cases in which the use of alcohol or drugs creates an imminent threat to the safety of persons or property, employees are required to report the violation. Failure to do so may result\n\nin disciplinary action, up to and including termination of employment.\n\nAs a part of our effort to maintain a workplace free of substance abuse, SUMMERSET ARF employees may be asked to submit to a medical examination and/or clinical testing for the presence of alcohol, marijuana and/or drugs. Within the limits of federal, state, and local laws, SUMMERSET ARF. reserves the right to\n\nexamine and test for marijuana, drugs and alcohol at our discretion.\n\nAs a condition of your employment with SUMMERSET ARF. Services, Inc., employees must comply with this Drug & Alcohol Use Policy. Be advised that no part of the Drug & Alcohol Use Policy shall be construed to alter or amend the at-\n\nwill employment relationship between SUMMERSET ARF. and its employees.\n\nEmployees found in violation of this policy may be subject to disciplinary action, up\n\nto and including termination of employment.\n\n <!-- Source PDF page 44 -->"], ["6.6 Sexual and Other Unlawful Harassment (California Employees)", "SUMMERSET ARF.is committed to a work environment in which all individuals are treated with respect. SUMMERSET ARF. expressly prohibits discrimination and all\n\nforms of harassment against employees, interns, contractors and volunteers.\n\nThe California Fair Employment and Housing Act (FEHA) defines sexual harassment as harassment based on sex or of a sexual nature; gender harassment; and harassment based on pregnancy, childbirth, or related medical conditions. Harassment on the basis of any other protected characteristic, including sex, race, national origin, color, ancestry, age, disability, religion, military status, veteran status, genetic information, medical condition, marital status, gender, gender identity, gender expression, sexual orientation, or any other characteristic protected\n\nby law is also strictly prohibited.\n\nThe law prohibits sexual harassment by coworkers, supervisors and managers, and non-employees, (such as vendors and customers), whether the person is the same or a different gender as the harasser. The definition of sexual harassment includes many forms of offensive behavior, including harassment of a person of the same gender as the harasser and harassment of a Company employee by a non-\n\nemployee. These behaviors include, but are not limited to:\n\n*« Unwanted sexual advances\n* Offering employment benefits in exchange for sexual favors\n\n* Actual or threatened retaliation\n\n*  Leering; making sexual gestures; or displaying sexually suggestive objects,\n\npictures, cartoons, or posters\n\n <!-- Source PDF page 45 -->\n\n« Making or using derogatory comments, epithets, slurs, or jokes,\n\nincluding racial, ethnic or religious jokes, slurs or remarks\n\n* Sexual comments including graphic comments about an individual's body;\nsexually degrading words used to describe an individual; or suggestive,\ndiscriminatory or obscene letters, notes, or invitations, including sending\n\nharassing emails or text messages and messages on social media\n\n* Physical harassment including touching or assault, as well as impeding or\n\nblocking movements\n\nComplaint Procedure:\n\nSUMMERSET ARF. strongly encourages the reporting of all instances of discrimination, harassment, or retaliation. Promptly report the incident to your supervisor if you believe you have experienced or witnessed harassment or discrimination based on any characteristic protected by law. Supervisors are\n\ninstructed to promptly report any complaints of misconduct to the Administrator.\n\nIf you believe it would be inappropriate to discuss the matter with your supervisor, you may bypass your supervisor, contact the Administrator, or report the matter directly to:\n\nAnderson Munoz\n\n1559 Roywood Dr. Lancaster CA 93535\n\n(818) 687-3830\n\nEmail: munozanderson23@yahoo.com\n\nAny reported allegations of harassment or discrimination will be investigated promptly, thoroughly, and impartially, providing all parties due\n\nprocess.\n\n <!-- Source PDF page 46 -->\n\nThe Company will keep the investigation confidential but only to the extent possible to conduct an impartial and thorough investigation. The Company will document and track the investigation to ensure reasonable progress and will provide appropriate resolution at the conclusion of the investigation. Any employee found to be engaged in any form of sexual or other unlawful harassment may be subject to\n\ndisciplinary action, up to and including termination of employment. Filing a Complaint with the Department of Fair Employment and Housing (DFEH):\n\nEmployees who believe that they have been sexually harassed may also file a complaint of discrimination with DFEH within one year of the harassment. DFEH is part of the State of California and serves as a neutral fact-finder, attempting to\n\nhelp parties resolve such disputes.\n\nIf DFEH finds sufficient evidence to establish that discrimination occurred and settlement efforts fail, DFEH may file a formal accusation. This will lead to either a public hearing or a lawsuit filed by DFEH on behalf of the complainant. If DFEH finds that harassment has occurred, it may order certain remedies to the complainant. For more information see DFEH-159 \"Guide for Complainants and\n\nRespondents\".\n\nDFEH website: www.dfeh.ca.gov.\n\nRetaliation Prohibited:\n\nSUMMERSET ARF. expressly prohibits retaliation against any individual who\n\nreports discrimination or harassment or participates in an investigation of such charges. Any form of retaliation is considered a direct violation of this policy and, like discrimination or harassment itself, will be subject to disciplinary action, up to\n\nand including termination of employment.\n\n <!-- Source PDF page 47 -->\n\nAny questions or concerns regarding this policy can be directed to the Administrator."], ["6.7 Telephone Usage", "SUMMERSET ARF. telephones are intended for the sole use of conducting company business. Personal use of the Company's telephones and individually owned cell phones during business hours should be kept to a minimum or for emergency purposes only. We ask that personal calls only be made or received outside of working hours, including during lunch or break time. Long distance\n\nphone calls which are not strictly business- related are expressly prohibited.\n\nAny employee found in violation of this policy will be subject to disciplinary action,\n\nup to and including termination of employment."], ["6.8 Personal Property", "Employees should use their discretion when bringing personal property into the\n\nworkplace. SUMMERSET ARF. assumes no risk for any loss or damage to personal\n\nproperty.\n\nAdditionally, employees may not possess or display any property that may be\n\nviewed as inappropriate or offensive on SUMMERSET ARF. premises."], ["6.9 Use of Company Property", "<!-- Source PDF page 48 -->\n\nCompany property refers to anything owned by the company: physical, electronic, intellectual, or otherwise. The use of company property is for business necessity\n\nonly.\n\nWhen materials or equipment are assigned to an employee for business, it is the employee's responsibility to see that the equipment is used properly and cared for properly. However, at all times, equipment assigned to the employee remains the property of the Company and is subject to reassignment and/or use by the\n\nCompany without prior notice or approval of the employee. SUMMERSET ARF. has created specific guidelines regarding the use of company\n\nequipment. Below is a list of employee responsibilities and limitations with regards\n\nto company property.\n\nPersonal use of company property:\n\nCompany property is not permitted to be taken from the premises for personal use\n\nwithout proper written authority from the Supervisor and/or the Administrator.\n\nCompany Tools:\n\nAll necessary tools are furnished to employees in order to assist them in their required duties. Each employee is, in turn, responsible for these tools. Tools damaged or stolen as a result of an employee's negligence will, to the\n\nextent permitted by federal, state and local law, be charged to the employee.\n\nCare of Company Property:\n\nOffice areas should be kept neat and orderly and all equipment should be well-\n\n <!-- Source PDF page 49 -->\n\nmaintained. The theft, misappropriation, or unauthorized removal, possession, or\n\nuse of company property or equipment is expressly prohibited.\n\nMy action in contradiction to the guidelines set herein may result in\n\ndisciplinary action, up to and including termination of employment."], ["6.10 Smoking", "SUMMERSET ARF. provides a smoke area for its employees, residents, customers, and visitors. Smoking, including the use of e-cigarettes and vaporizers, are allowed only in designated areas in the workplace. Cannabis is always\n\nprohibited for employees and visitors."], ["6.11 Computer, Email & Internet Usage", "Computers, email, and the Internet alow SUMMERSET ARF. employees to be more productive. However, it is important that all employees use good business judgment\n\nwhen using SUMMERSET ARF electronic communications systems (ECS).\n\nStandards of Conduct and ECS\n\nSUMMERSET ARF. strives to maintain a workplace free of discrimination and harassment. Therefore SUMMERSET ARF prohibits the use of the Company's ECS for bullying, harassing, discriminating, or engaging in other unlawful misconduct, in\n\nviolation of the Company's policy against discrimination and harassment.\n\n <!-- Source PDF page 50 -->\n\nCopyright and other Intellectual Property\n\nRespect all copyright and other intellectual property laws. For the Company's protection as well as your own, it is critical that you show proper respect for the laws governing copyright, fair use of copyrighted material owned by others, trademarks and other intellectual property, including the Company's own copyrights, trademarks and brands. Employees are also responsible for ensuring that, when\n\nsending any material over the Internet, they have the appropriate distribution rights.\n\nSUMMERSET ARF. purchases and licenses the use of various computer software for business purposes and does not own the copyright to this software or its related documentation. Unless authorized by the software developer, SUMMERSET ARF. does not have the right to reproduce such software for use on more than one computer. Employees may only use software according to the software license agreement. SUMMERSET ARF. prohibits the illegal duplication of\n\nsoftware and its related documentation.\n\nECS Guidelines\n\nThe following behaviors are examples of previously stated or additional actions and activities under this policy that are prohibited:\n\n* Sending or posting discriminatory, harassing, or threatening messages or\nimages about coworkers, supervisors or the Company that violate the\n\nCompany's policy against discrimination and harassment.\n\n* Stealing, using, or disclosing someone else's code or password without\n2.2 authorization.\n\n*  Pirating or downloading Company-owned software without permission.\n\n* Sending or posting the Company's confidential material, trade secrets, or\n\nnon-public proprietary information outside of the Company.\n\n <!-- Source PDF page 51 -->\n\n* Violating copyright laws and failing to observe licensing agreements.\n\n¢ Participating in the viewing or exchange of pornography or obscene\n\nmaterials.\n\n¢ Sending or posting messages that threaten, intimidate, coerce, or otherwise\n\ninterfere with the job performance of fellow employees.\n\n* Attempting to break into the computer system of another organization\nor person.\n\n¢ Refusing to cooperate with a security investigation.\n\n« Using the Internet for gambling or any illegal activities.\n\n* Sending or posting messages that disparage another organization's\n\nproducts or services.\n\n* Passing off personal views as representing those of\nSUMMERSET ARF.\n\nPrivacy and Monitoring\n\nComputer hardware, software, email, Internet connections, and all other computer, data storage or ECS provided by SUMMERSET ARF are the property of SUMMERSET ARF. Employees have no right of personal privacy when using SUMMERSET ARF. ECS. To ensure productivity of employees, compliance with this policy and with all applicable laws, including harassment and anti-\n\ndiscrimination laws, computer, email and Internet usage may be monitored. Violations of this policy may result in disciplinary action, up to and including termination of employment. Questions or concerns related this policy should be\n\ndirected to your supervisor or the Administrator."], ["6.12 Company Supplies", "<!-- Source PDF page 52 -->\n\nOnly authorized persons may purchase supplies in the name of SUMMERSET ARF\n\nNo employee whose regular duties do not include purchasing shall incur any expense on behalf of SUMMERSET ARF or bind SUMMERSET ARF,.by any\n\npromise or representation without express written approval."], ["6.13 Company Vehicles", "SUMMERSET ARF. may assign employees to transport residents in facility vehicles and to travel for business purposes. This policy outlines the rules for use and care\n\nof Company provided vehicles.\n\nBusiness Use:\n\nCompany-owned vehicles are to be used for business purposes only. Personal use of a Company vehicle is prohibited. Company vehicle may only be driven by employees. The only passengers permitted in company vehicles are residents and fellow employees.\n\nDriving Records:\n\nEmployees who drive Company vehicles must maintain a valid driver's license and\n\nmust notify their supervisor of any changes in their driver's license status.\n\nAdditionally, drivers may be subject to periodic driving record checks.\n\nLocal Regulations:\n\n <!-- Source PDF page 53 -->\n\nEmployees must follow state and local traffic laws while using the Company vehicle. All drivers and passengers are required to use seat belts at all times. Use of handheld cell phones and texting while driving is strictly prohibited. Employees will be responsible for any driving and parking infractions or fines incurred while driving the Company vehicle. Traffic violations may result in loss of driving\n\nprivileges.\n\nAccidents & Theft:\n\nEmployees must lock the vehicle when it is left unattended. Employees are required to report any vehicle-related accident, theft or damage to their supervisor\n\nimmediately.\n\nSubstance Use and Abuse:\n\nEmployees are not permitted, under any circumstances, to operate a Company vehicle when his or her ability to do so safely has been impaired in any way. Employees shall not operate any Company vehicle while using or consuming alcohol, marijuana, illegal drugs or prescription medications that may impair their ability to drive. Convictions for driving under the influence of alcohol or drugs or vehicular incidents related to the use of drugs or alcohol may result in\n\nloss of driving privileges. Smoking is also prohibited in the vehicle.\n\nFuel Maintenance:\n\nIt is the employee's responsibility to ensure the vehicle remains properly fueled. Employees should use the funds provided for fuel to fill the tank once the fuel tank level lowers to half full. Employees should always verify that Company vehicles have\n\nample fuel to reach destinations.\n\n <!-- Source PDF page 54 -->\n\nThe Company reserves the right to revoke vehicle privileges at any time. Any employee found to be engaged in any form of unsafe driving maybe subject to\n\ndisciplinary action, up to and including termination."], ["6.14 Training and Professional Development", "SUMMERSET ARF.is committed to the personal and developmental growth of all its employees. To this end, SUMMERSET ARF. not only prepares their new hires to succeed with the Company. The Company also continually teaches, develops, and improves current employees' skills in order to constructively respond to\n\ntoday's on-going challenges and to know how to safely and effectively meet client\n\nneeds.\n\nSUMMERSET ARF. strongly encourages the training and development of employees to aid them in improving their ability to succeed at the current position,\n\nand also to prepare them for career advancement.\n\nThroughout the year in-service meetings will be posted. Employees are required to attend all mandatory meetings. Employees required to attend these training\n\nsessions will be compensated pursuant to applicable federal and state laws.\n\nTrainings and meetings are a part of our program and are designed for the health, safety, and well-being of our residents. Staff meetings and in-services are mandatory for all staff members. Any absence from in-service meetings must be\n\napproved by management. Dates, topics, and locations are subject to change.\n\nEmployees are further required to complete Direct Support Professional Trainings (DSPT), as per State of California regulations.\n\nIt is the policy of this Company that employees shall satisfactorily complete DSP 1\n\nwithin one year from the date of hire, and satisfactorily complete DSP 2 within\n\n <!-- Source PDF page 55 -->\n\ntwo years from the date of hire.\n\n <!-- Source PDF page 56 -->\n\nEmployees are not required to repeat any DSPT course successfully completed\n\nprior to being hired by the Company.\n\nEmployees who fail to comply with the required in-service training, mandatory meetings, and the DSPT requirements may be subject to disciplinary action, up to\n\nand including termination of employment."], ["6.15 Sexual & Other Unlawful Harassment", "SUMMERSET ARF.is committed to a work environment in which all individuals are treated with respect. SUMMERSET ARF. expressly prohibits discrimination and all forms of employee harassment based on race, color, religion, sex, pregnancy, national origin, age, disability, military or veteran status, or status in any group\n\nprotected by state or local law.\n\nSexual harassmentis a form of discrimination and is prohibited by law. For purposes of this policy sexual harassment is defined as unwelcome sexual advances, requests for sexual favors, and other verbal or physical conduct of a sexual nature when this conduct explicitly or implicitly affects an individual's employment, unreasonably interferes with an individual's work performance, or creates an intimidating, hostile, or offensive work environment. Unwelcome sexual advances (either verbal or physical), requests for sexual favors, and other verbal or physical conduct of a sexual nature constitute sexual harassment when : (1) submission to such conduct is made either explicitly or implicitly a term or condition of employment; (2) submission or rejection of the conduct is used as a\n\nbasis for making employment decisions; or, (3) the conduct has the purpose or\n\n <!-- Source PDF page 57 -->\n\neffect of interfering with work performance or creating an intimidating, hostile, or\n\noffensive work environment.\n\n <!-- Source PDF page 58 -->\n\nSexual and unlawful harassment may include a range of behaviors and may involve individuals of the same or different gender. These behaviors include, but are not\n\nlimited to:\n\n¢ Unwanted sexual advances or requests for sexual favors.\n* Sexual or derogatory jokes, comments, or innuendo\n\n« Unwelcomed physical interaction\n\n« Insulting or obscene comments or gestures\n\n* Offensive email, voicemail, or text messages\n\n* Suggestive or sexually explicit posters, calendars, photographs, graffiti, or\n\ncartoons\n* Making or threatening reprisals after a negative response to sexual advances\n\n* Visual conduct that includes leering, making sexual gestures, or displaying of\n\nsexually suggestive objects or pictures, cartoons or posters\n« Verbal sexual advances or propositions\n\n* Physical conduct that includes touching, assaulting, or impeding or blocking\n\nmovements\n\n* Abusive or malicious conduct that a reasonable person would find hostile,\n\noffensive, and unrelated to the Company's legitimate business interests\n\n* My other visual, verbal, or physical conduct or behavior deemed\n\ninappropriate by the Company\n\nHarassment on the basis of any other protected characteristic is also strictly prohibited.\n\nComplaint Procedure:\n\nSUMMERSET ARF. strongly encourages the reporting of all instances of\n\n <!-- Source PDF page 59 -->\n\ndiscrimination, harassment, or retaliation. If you believe you have experienced or witnessed harassment or discrimination based on sex, race, national origin, disability, or another factor, promptly report the incident to your supervisor. If you believe it would be inappropriate to discuss the matter with your supervisor,\n\nyou may bypass your supervisor and report it directly to:\n\nAnderson Munoz 1559 Roywood Dr Lancaster, CA 93535\n\n(818) 687-3830\n\nEmail: munozanderson23@yahoo.com\n\nAny reported allegations of harassment or discrimination will be\n\ninvestigated promptly, thoroughly, and impartially.\n\nAny employee found to be engaged in any form of sexual or other unlawful harassment may be subject to disciplinary action, up to and including termination\n\nof employment.\n\nRetaliation Prohibited:\n\nSUMMERSET ARF. expressly prohibits retaliation against any individual who reports discriminati
